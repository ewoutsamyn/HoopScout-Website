<svg viewBox="0 0 320 692" xmlns="http://www.w3.org/2000/svg" font-family="'Barlow Semi Condensed','Barlow',sans-serif" role="img" aria-label="BBall Sideline IQ shot confirm sheet preview">
  <defs><clipPath id="scr2"><rect width="320" height="692"/></clipPath></defs>
  <g clip-path="url(#scr2)">
    <rect width="320" height="692" fill="#0B0D10"/>

    <!-- header band + score bar -->
    <rect width="320" height="150" fill="#151920"/>
    <text x="20" y="34" fill="#8A93A2" font-size="12" letter-spacing="1.5">LIVE · Q3</text>
