# Deploys this static site to GitHub Pages on every push to `main`.
# Enable it once: on GitHub, go to Settings -> Pages -> "Build and
# deployment" -> Source: "GitHub Actions". After that, every push
# publishes automatically. Delete this file if you host elsewhere
# (Netlify, Vercel, Cloudflare Pages) instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo root is the site (index.html lives at the top).
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
