<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins','Barlow Semi Condensed',sans-serif" role="img" aria-label="BBall Sideline IQ — coaching stats, courtside">
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F2790A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F2790A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0B0D10"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- court arc motif -->
  <g stroke="#232833" stroke-width="2" fill="none" opacity="0.7">
    <circle cx="1000" cy="500" r="220"/>
    <circle cx="1000" cy="500" r="150"/>
  </g>

  <!-- logo -->
  <g transform="translate(96,120) scale(1.7)">
    <circle cx="48" cy="46" r="33" fill="#F4821F"/>
    <line x1="48" y1="13" x2="48" y2="79" stroke="#0D1B2A" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 20,24 Q 46,46 20,68" stroke="#0D1B2A" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M 76,24 Q 50,46 76,68" stroke="#0D1B2A" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <circle cx="76" cy="76" r="15" fill="rgba(255,255,255,0.10)" stroke="#fff" stroke-width="5"/>
    <line x1="87" y1="87" x2="96" y2="96" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Wordmark at 76, not the old 86: "BBall Sideline IQ" is 17 characters
       against "HoopScout"'s 9 and needs the extra room on a 1200-wide card.
       The strapline is two lines for the same reason. -->
  <text x="96" y="350" fill="#FFFFFF" font-size="76" font-weight="700">BBall Sideline IQ</text>
  <text x="98" y="415" fill="#C6CDD8" font-family="'Barlow Semi Condensed',sans-serif" font-size="38" font-weight="600">The stats crew on your sideline.</text>
  <text x="98" y="462" fill="#C6CDD8" font-family="'Barlow Semi Condensed',sans-serif" font-size="38" font-weight="600">Track every possession, courtside.</text>
  <g transform="translate(98,505)">
    <rect width="220" height="52" rx="26" fill="#F2790A"/>
    <text x="110" y="34" fill="#06171A" font-family="'Barlow Semi Condensed',sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="1">COMING SOON</text>
  </g>
</svg>
