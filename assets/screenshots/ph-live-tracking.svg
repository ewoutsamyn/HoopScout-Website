    <text x="160" y="112" fill="#8A93A2" font-size="10" text-anchor="middle" letter-spacing="1">PAUSED</text>
    <text x="300" y="86" fill="#E8ECF2" font-size="15" font-weight="700" text-anchor="end">EAGLES</text>
    <text x="300" y="126" fill="#E8ECF2" font-size="46" font-weight="700" text-anchor="end" font-variant="tabular-nums">51</text>

    <!-- dimmed cards + grid -->
    <g opacity="0.35">
