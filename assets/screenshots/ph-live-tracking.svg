      <g transform="translate(72,172)"><rect width="52" height="70" rx="10" fill="#141821" stroke="#232833"/></g>
      <g transform="translate(130,172)"><rect width="52" height="70" rx="10" fill="#141821" stroke="#232833"/></g>
      <g transform="translate(188,172)"><rect width="52" height="70" rx="10" fill="#141821" stroke="#232833"/></g>
      <g transform="translate(246,172)"><rect width="52" height="70" rx="10" fill="#141821" stroke="#232833"/></g>
      <g transform="translate(14,262)"><rect width="66" height="56" rx="12" fill="#1E232B"/></g>
      <g transform="translate(88,262)"><rect width="66" height="56" rx="12" fill="#1E232B"/></g>
      <g transform="translate(162,262)"><rect width="66" height="56" rx="12" fill="#1E232B"/></g>
      <g transform="translate(236,262)"><rect width="66" height="56" rx="12" fill="#1E232B"/></g>
